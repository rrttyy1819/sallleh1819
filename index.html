        function iconKey(cat) {
            const c = String(cat).toLowerCase();
            if (cat === ALL) return 'grid';
            if (c.includes('لغة') || c.includes('لغو') || c.includes('language') || c.includes('nlp') || c.includes('ذكاء') || c.includes('اصطناعي') || c.includes('ai')) return 'chat';
            if (c.includes('رؤية') || c.includes('صور') || c.includes('بصر') || c.includes('vision') || c.includes('image')) return 'eye';
            if (c.includes('أمن') || c.includes('امن') || c.includes('حماية') || c.includes('security') || c.includes('سيبراني')) return 'shield';
            if (c.includes('سحاب') || c.includes('cloud') || c.includes('إنترنت') || c.includes('اشياء') || c.includes('iot')) return 'cloud';
            if (c.includes('برمج') || c.includes('هندسة') || c.includes('software') || c.includes('code')) return 'code';
            if (c.includes('بيانات') || c.includes('data') || c.includes('علم')) return 'database';
            if (c.includes('عميق') || c.includes('تعلم') || c.includes('learning') || c.includes('أنظمة') || c.includes('ذكية') || c.includes('systems')) return 'chip';
            return 'doc';
        }

        function setMeta(attr, name, content) {
            let el = document.head.querySelector(`meta[${attr}="${name}"]`);
            if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
            el.setAttribute('content', content);
        }
        function setCanonical(url) {
            let el = document.head.querySelector('link[rel="canonical"]');
            if (!el) { el = document.createElement('link'); el.rel = 'canonical'; document.head.appendChild(el); }
            el.href = url;
        }
        function updateMetaForView({ title, desc, canonical, ogType, jsonld }) {
            document.title = title;
            setMeta('name', 'description', desc);
            setMeta('property', 'og:title', title);
            setMeta('property', 'og:description', desc);
            setMeta('property', 'og:url', canonical);
            setMeta('property', 'og:type', ogType || 'website');
            setCanonical(canonical);
            document.getElementById('jsonld-view').textContent = JSON.stringify(jsonld || {});
        }

        function renderCategoryTiles() {
            categoryGrid.innerHTML = '';
            const counts = {};
            papers.forEach(p => { const c = p.category || 'عام'; counts[c] = (counts[c] || 0) + 1; });
            const cats = [ALL, ...Object.keys(counts)];

            cats.forEach(cat => {
                const n = cat === ALL ? papers.length : counts[cat];
                const a = document.createElement('a');
                a.href = '/category/' + catSlug(cat);
                a.className = 'group bg-white rounded-2xl p-4 shadow-sm border border-sky-100 hover:shadow-xl hover:border-brand-300 hover:-translate-y-0.5 transition-all flex items-center gap-4';

        function renderCategoryPapers() {
            const base = papers.filter(p => currentCat === ALL || (p.category || 'عام') === currentCat);
            const q = searchInput.value.trim().toLowerCase();
            let list = base.filter(p => !q || [p.title, p.authors, p.category, p.summary, p.year].join(' ').toLowerCase().includes(q));
            if (sortSelect.value === 'newest') list.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
            if (sortSelect.value === 'oldest') list.sort((a, b) => (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999));

            updateCategoryHeader();
            countEl.textContent = t('showing', list.length, base.length);
            grid.innerHTML = '';
            if (list.length === 0) { grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">${base.length === 0 ? t('noPapers') : t('noResults')}</div>`; return; }

            list.forEach(p => {
                const card = document.createElement('article');
                card.className = 'bg-white rounded-2xl shadow-sm border border-sky-100 hover:shadow-xl hover:border-brand-300 flex flex-col justify-between overflow-hidden';
                card.innerHTML = `
                    <div class="p-6 space-y-3">
                        <div class="flex items-center justify-between text-xs font-bold text-brand-600">
                            <span class="bg-brand-50 px-3 py-1 rounded-md border border-brand-100">${label(p.category || 'عام')}</span>
                            <span>${p.year || ''}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 leading-snug" dir="auto">${p.title}</h3>
                        <p class="text-xs text-slate-500 font-medium" dir="auto">${p.authors || ''}</p>
                        <p class="text-slate-600 text-sm leading-relaxed line-clamp-5" dir="auto">${paperSummary(p)}</p>
                    </div>
                    <div class="px-6 py-4 bg-sky-50/50 border-t border-sky-50 flex flex-wrap items-center gap-2">
                        <a href="/papers/${paperSlug(p)}" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all">${t('viewPaper')}</a>
                        ${safeUrl(p.pdf_url) ? `<a href="${safeUrl(p.pdf_url)}" target="_blank" rel="noopener" class="bg-white hover:bg-sky-50 text-brand-700 font-bold text-xs px-4 py-2 rounded-lg border border-sky-200">${t('openPdf')}</a>` : ''}
                    </div>`;
                grid.appendChild(card);
            });
        }

        function updateCategoryHeader() {
            if (!currentCat) return;
            document.getElementById('catTitle').textContent = label(currentCat);
            document.getElementById('catSubtitle').textContent = loaded ? t('nInField', papers.filter(p => currentCat === ALL || (p.category || 'عام') === currentCat).length) : '';
        }

        function showPaper(slug) {
            const p = papers.find(x => paperSlug(x) === slug);
            if (!p) { showHome(); return; }
            view = 'paper';
            [homeView, catView, dataView, methodologyView, reportView].forEach(v => v.classList.add('hidden'));
            paperView.classList.remove('hidden');
            
            document.getElementById('paperTitle').textContent = p.title;
            document.getElementById('paperAuthors').textContent = p.authors || '';
            document.getElementById('paperYear').textContent = p.year || '';
            document.getElementById('paperSummary').textContent = paperSummary(p);
            
            const catEl = document.getElementById('paperCat');
            catEl.textContent = label(p.category || 'عام'); catEl.href = '/category/' + catSlug(p.category || 'عام');
            document.getElementById('paperBackLink').href = '/category/' + catSlug(p.category || 'عام');
            
            const pdfBtn = document.getElementById('paperPdfBtn');
            const pageBtn = document.getElementById('paperPageBtn');
            pdfBtn.style.display = p.pdf_url ? '' : 'none'; if (p.pdf_url) pdfBtn.href = p.pdf_url;
            pageBtn.style.display = p.page_url ? '' : 'none'; if (p.page_url) pageBtn.href = p.page_url;

            updateMetaForView({
                title: p.title + ' | LoboTech', desc: paperSummary(p).slice(0, 160),
                canonical: SITE + '/papers/' + slug, ogType: 'article',
                jsonld: { "@context": "https://schema.org", "@type": "ScholarlyArticle", "headline": p.title, "author": [{"@type":"Person", "name": p.authors}], "datePublished": p.year, "abstract": paperSummary(p), "url": SITE + '/papers/' + slug }
            });
            window.scrollTo(0, 0);
        }

        function showMethodology() {
            view = 'methodology';
            [homeView, catView, dataView, paperView, reportView].forEach(v => v.classList.add('hidden'));
            methodologyView.classList.remove('hidden');
            updateMetaForView({ title: 'منهجية التلخيص | LoboTech', desc: 'كيف نختار الأوراق ونلخصها ونتحقق من دقتها.', canonical: SITE + '/methodology' });
            window.scrollTo(0, 0);
        }

        function showReport() {
            view = 'report';
            [homeView, catView, dataView, paperView, methodologyView].forEach(v => v.classList.add('hidden'));
            reportView.classList.remove('hidden');
            updateMetaForView({ title: 'أبلغ عن خطأ | LoboTech', desc: 'ساعدنا في تصحيح أي خطأ.', canonical: SITE + '/report' });
            window.scrollTo(0, 0);
        }

        function showData() {
            view = 'data';
            [homeView, catView, paperView, methodologyView, reportView].forEach(v => v.classList.add('hidden'));
            dataView.classList.remove('hidden');
            document.getElementById('dataIcon').innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + ICONS.database + '</svg>';
            dataSearch.value = ''; dataType = 'all'; renderDataChips(); renderDataSites();
            updateMetaForView({ title: 'مصادر البيانات المفتوحة | LoboTech', desc: 'دليل مصادر البيانات المفتوحة للمشاريع التقنية.', canonical: SITE + '/data' });
            window.scrollTo(0, 0);
        }

        function showCategory(cat) {
            view = 'cat'; currentCat = cat;
            [homeView, dataView, paperView, methodologyView, reportView].forEach(v => v.classList.add('hidden'));
            catView.classList.remove('hidden');
            document.getElementById('catIcon').innerHTML = iconSvg(cat, 'w-6 h-6');
            searchInput.value = ''; sortSelect.value = 'sheet';
            if (loaded) renderCategoryPapers(); else grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">${t('loadingPapers')}</div>`;
            updateMetaForView({ title: label(cat) + " | LoboTech", desc: t('fieldsDesc'), canonical: SITE + '/category/' + catSlug(cat) });
            window.scrollTo(0, 0);
        }

        function showHome() {
            view = 'home';
            [catView, dataView, paperView, methodologyView, reportView].forEach(v => v.classList.add('hidden'));
            homeView.classList.remove('hidden');
            updateMetaForView({ title: 'لوبو تيك | LoboTech — ملخصات أوراق الذكاء الاصطناعي بالعربي', desc: 'دليل عربي لأهم الأوراق العلمية في الذكاء الاصطناعي.', canonical: SITE + '/' });
        }

        function route() {
            const path = location.pathname.replace(/\/+$/, '') || '/';
            if (path === '/data') return showData();
            if (path === '/methodology') return showMethodology();
            if (path === '/report') return showReport();
            if (path.indexOf('/papers/') === 0) return showPaper(decodeURIComponent(path.slice(8)));
            if (path.indexOf('/category/') === 0) return showCategory(catFromSlug(decodeURIComponent(path.slice(10))));
            showHome();
        }

        document.addEventListener('click', e => {
            const a = e.target.closest && e.target.closest('a[href^="/"]');
            if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
            e.preventDefault();
            history.pushState(null, '', a.getAttribute('href'));
            route();
            document.getElementById('mobileMenu').classList.add('hidden');
        });

        const DATA_TYPES_KEYS = { ml: 'تعلم آلة', repo: 'أبحاث ومستودعات', gov: 'حكومية ودولية' };
        let dataType = 'all';
        const dataSearch = document.getElementById('dataSearch');
        const dataGrid = document.getElementById('dataGrid');
        const dataChips = document.getElementById('dataChips');
        const dataCount = document.getElementById('dataCount');

        function renderDataChips() {
            dataChips.innerHTML = '';
            ['all', ...Object.keys(DATA_TYPES_KEYS)].forEach(k => {
                const b = document.createElement('button');
                b.type = 'button'; b.textContent = k === 'all' ? t('dataAll') : DATA_TYPES_KEYS[k];
                b.className = `px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${k === dataType ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-600 border-emerald-200 hover:border-emerald-500'}`;
                b.onclick = () => { dataType = k; renderDataChips(); renderDataSites(); };
                dataChips.appendChild(b);
            });
        }

        function renderDataSites() {
            const q = dataSearch.value.trim().toLowerCase();
            const list = DATA_SITES.filter(s => (dataType === 'all' || s.type === dataType) && (!q || [s.name, s.desc].join(' ').toLowerCase().includes(q)));
            document.getElementById('dataSubtitle').textContent = t('dataSubtitle', DATA_SITES.length);
            dataCount.textContent = t('showingSites', list.length, DATA_SITES.length);
            dataGrid.innerHTML = list.length === 0 ? `<div class="col-span-full text-center py-12 text-slate-400">${t('noResults')}</div>` : '';
            
            list.forEach(s => {
                const href = safeUrl(s.url);
                const card = document.createElement(href ? 'a' : 'article');
                if (href) { card.href = href; card.target = '_blank'; }
                card.className = 'bg-white rounded-2xl shadow-sm border border-emerald-100 hover:shadow-xl transition-all flex flex-col justify-between overflow-hidden';
                card.innerHTML = `<div class="p-6 space-y-3"><span class="inline-block bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-md border border-emerald-100">${DATA_TYPES_KEYS[s.type]}</span><h3 class="text-lg font-bold text-slate-900 leading-snug">${s.name}</h3><p class="text-slate-600 text-sm leading-relaxed">${s.desc}</p></div><div class="px-6 py-4 bg-emerald-50/50 border-t border-emerald-50">${href ? `<span class="inline-block bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-lg">${t('visitSite')}</span>` : ''}</div>`;
                dataGrid.appendChild(card);
            });
        }

        const NAV = [{ id: 'about', key: 'navAbout' }, { id: 'services', key: 'navServices' }, { id: 'research', key: 'navFields' }, { id: 'tools', key: 'navTools' }, { id: 'tips', key: 'navTips' }];
        
        function renderNav() {
            [document.getElementById('navLinks'), document.getElementById('mobileMenu'), document.getElementById('footerLinks')].forEach(box => {
                box.innerHTML = '';
                NAV.forEach(n => {
                    const a = document.createElement('a');
                    a.href = '/' + (view === 'home' ? '#' : '') + n.id;
                    a.className = box.id === 'mobileMenu' ? 'mobile-link block px-3 py-2.5 rounded-lg hover:bg-sky-50' : 'hover:text-brand-600 transition-colors';
                    a.textContent = t(n.key);
                    if(view !== 'home') a.onclick = (e) => { e.preventDefault(); history.pushState(null, '', '/'); route(); setTimeout(() => document.getElementById(n.id).scrollIntoView(), 50); }
                    box.appendChild(a);
                });
            });
            const extra = [{ href: '/methodology', label: 'منهجية التلخيص' }, { href: '/report', label: 'أبلغ عن خطأ' }];
            const footerBox = document.getElementById('footerLinks');
            extra.forEach(x => { const a = document.createElement('a'); a.href = x.href; a.textContent = x.label; a.className = 'hover:text-brand-600 text-slate-500'; footerBox.appendChild(a); });
        }

        function toggleModal(id, show) {
            const m = document.getElementById(id);
            if (show) { m.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
            else { m.classList.add('hidden'); document.body.style.overflow = ''; }
        }

        const SERVICES = [
            { icon: 'phone', t: 'الاستشارة', d: 'تواصل معي مباشرة للاستشارات التقنية والأكاديمية عبر الهاتف أو البريد.', action: 'contact' },
            { icon: 'pencil', t: 'المقالات', d: 'مقالات وأوراق علمية في الذكاء الاصطناعي والتقنية.', action: 'none' },
            { icon: 'cap', t: 'الدورات', d: 'دورات تدريبية في بايثون، باور بي آي، وقواعد البيانات.', action: 'courses' },
            { icon: 'code', t: 'تحليل البيانات والبرمجة', d: 'تحليل البيانات وبناء الحلول البرمجية المخصصة.', action: 'none' }
        ];
        function renderServices() {
            const grid = document.getElementById('servicesGrid'); grid.innerHTML = '';
            SERVICES.forEach(sv => {
                const card = document.createElement('div');
                card.className = `service-card w-full sm:w-[calc(50%-0.625rem)] lg:w-[calc(25%-0.95rem)] bg-white rounded-2xl border border-sky-100 p-6 space-y-4 ${sv.action !== 'none' ? 'clickable-card hover:border-brand-400' : ''}`;
                card.innerHTML = `<div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-400 text-white flex items-center justify-center"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">${ICONS[sv.icon]}</svg></div><h3 class="font-black text-slate-900 text-lg">${sv.t}</h3><p class="text-sm text-slate-600 leading-relaxed">${sv.d}</p>`;
                if (sv.action === 'contact') card.onclick = () => toggleModal('contactModal', true);
                if (sv.action === 'courses') card.onclick = () => toggleModal('coursesModal', true);
                grid.appendChild(card);
            });
        }

        const TIPS = [
            { t: 'ابدأ بالملخص والخاتمة', d: 'اقرأهما أولاً لتقرر هل تستحق الورقة قراءتها كاملة.', detail: 'الملخص يعطيك لمحة سريعة عن المشكلة والحل والنتائج، بينما الخاتمة تلخص المساهمات الفعلية.', example: 'مثال: في ورقة BERT، الملخص يوضح فوراً أنها تقدم فهماً ثنائياً للسياق.' },
            { t: 'ابدأ بورقة مراجعة (Survey)', d: 'أوراق المراجعة ترسم لك خريطة المجال وأهم الأعمال فيه.', detail: 'عند الدخول في مجال بحثي جديد، ابحث دائماً عن ورقة تحمل عنوان "A Survey on..."', example: 'مثال: بدلاً من قراءة 50 ورقة عشوائية، اقرأ ورقة مراجعة واحدة شاملة.' },
            { t: 'تتبّع الاستشهادات', d: 'من صفحة الورقة في Google Scholar افتح "Cited by".', detail: 'الاستشهادات تدلك على كيفية تطور الفكرة والتحسينات الحديثة.', example: 'مثال: عند قراءة ورقة ResNet، "Cited by" يظهر آلاف الأبحاث التي عدلت عليها.' },
            { t: 'تحقق من حالة النشر', d: 'ميّز بين ورقة منشورة بعد تحكيم وورقة قبل النشر (preprint).', detail: 'الأوراق في arXiv غالباً مسودات أولية، بينما المنشورة في مؤتمرات مثل NeurIPS تكون موثوقة أكثر.', example: 'مثال: انتبه عند اعتماد أرقام أداء من ورقة على arXiv لم تُقبل بعد.' },
            { t: 'دوّن مراجعك من البداية', d: 'استخدم أداة مثل Zotero منذ أول ورقة تقرؤها.', detail: 'جمع الأوراق دون تنظيم يؤدي إلى ضياع وقت كبير لاحقاً. Zotero يحفظ المقال مع PDF.', example: 'مثال: حفظ ورقة Transformer مع تصنيفها في مجلد "نماذج اللغة".' },
            { t: 'ابحث عن البيانات والشيفرة', d: 'إن أتاح المؤلفون بياناتهم وشيفرتهم فجرّب إعادة النتائج بنفسك.', detail: 'القراءة وحدها لا تكفي. الأوراق التي ترفق روابط GitHub تتيح لك تشغيل النماذج وتغيير المعاملات.', example: 'مثال: فتح رابط جيت هاب لورقة LoRA وتجربة تشغيل الكود المصغر.' }
        ];
        function renderTips() {
            const grid = document.getElementById('tipsGrid'); grid.innerHTML = '';
            TIPS.forEach((tp, i) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-50/70 rounded-2xl border border-sky-100 p-5 flex items-start gap-4 cursor-pointer hover:border-brand-300 hover:shadow-lg transition-all group';
                card.innerHTML = `<div class="w-10 h-10 shrink-0 rounded-xl bg-brand-600 text-white flex items-center justify-center font-black text-sm group-hover:scale-105">${String(i + 1).padStart(2, '0')}</div><div class="flex-1 min-w-0"><h3 class="font-bold text-slate-900 text-base group-hover:text-brand-600">${tp.t}</h3><p class="text-sm text-slate-600 leading-relaxed mt-1 line-clamp-2">${tp.d}</p><span class="inline-flex items-center gap-1 text-xs font-bold text-brand-600 mt-2">عرض التفاصيل والمثال <svg class="w-3.5 h-3.5 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></span></div>`;
                card.onclick = () => {
                    document.getElementById('tipModalNum').textContent = String(i + 1).padStart(2, '0');
                    document.getElementById('tipModalTitle').textContent = tp.t;
                    document.getElementById('tipModalDesc').textContent = tp.detail;
                    document.getElementById('tipModalExample').textContent = tp.example;
                    toggleModal('tipModal', true);
                };
                grid.appendChild(card);
            });
        }

        const TOOLS = [
            { name: 'Google Scholar', icon: 'cap', url: 'https://scholar.google.com', desc: 'محرك بحث في الأوراق العلمية والرسائل والكتب.' },
            { name: 'Semantic Scholar', icon: 'search', url: 'https://www.semanticscholar.org', desc: 'بحث أكاديمي يعتمد على الذكاء الاصطناعي.' },
            { name: 'arXiv', icon: 'archive', url: 'https://arxiv.org', desc: 'أرشيف مفتوح للأوراق قبل النشر في الحاسب والفيزياء.' },
            { name: 'Zotero', icon: 'book', url: 'https://www.zotero.org', desc: 'برنامج لإدارة المراجع وتوليد الاستشهادات.' },
            { name: 'Connected Papers', icon: 'network', url: 'https://www.connectedpapers.com', desc: 'يرسم خريطة بصرية للأوراق المرتبطة بورقة معينة.' },
            { name: 'Overleaf', icon: 'pencil', url: 'https://www.overleaf.com', desc: 'محرر LaTeX عبر المتصفح لكتابة الأوراق العلمية.' }
        ];
        function renderTools() {
            const grid = document.getElementById('toolsGrid'); grid.innerHTML = '';
            TOOLS.forEach(tl => {
                const card = document.createElement('a');
                card.href = tl.url; card.target = '_blank'; card.rel = 'noopener';
                card.className = 'group w-full sm:w-[calc(50%-0.625rem)] lg:w-[calc(33.333%-0.85rem)] bg-white rounded-2xl border border-sky-100 hover:border-brand-300 hover:shadow-lg p-4 flex items-start gap-4';
                card.innerHTML = `<div class="w-12 h-12 shrink-0 rounded-xl bg-brand-600 text-white flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">${ICONS[tl.icon]}</svg></div><div class="min-w-0"><h3 class="font-bold text-slate-900 text-base group-hover:text-brand-600">${tl.name}</h3><p class="text-xs sm:text-sm text-slate-600 leading-relaxed mt-1">${tl.desc}</p></div>`;
                grid.appendChild(card);
            });
        }

        // Init
        window.addEventListener('popstate', route);
        document.getElementById('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('svl_lang', lang); } catch (e) {} applyLang(); };
        document.getElementById('menuBtn').onclick = (e) => { const open = document.getElementById('mobileMenu').classList.toggle('hidden') === false; e.currentTarget.setAttribute('aria-expanded', String(open)); };
        document.getElementById('closeTipModal').onclick = () => toggleModal('tipModal', false);
        document.getElementById('closeTipModalBtn').onclick = () => toggleModal('tipModal', false);
        
        document.getElementById('reportForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const page = document.getElementById('reportPage').value || '';
            const msg = document.getElementById('reportMsg').value || '';
            location.href = 'mailto:sallleh1819@gmail.com?subject=' + encodeURIComponent('بلاغ عن خطأ - LoboTech') + '&body=' + encodeURIComponent('الصفحة: ' + page + '\n\n' + msg);
        });

        const debouncedRenderPapers = debounce(() => { if (loaded) renderCategoryPapers(); }, 150);
        const debouncedRenderData = debounce(() => renderDataSites(), 150);
        searchInput.addEventListener('input', debouncedRenderPapers);
        sortSelect.addEventListener('change', () => { if (loaded) renderCategoryPapers(); });
        dataSearch.addEventListener('input', debouncedRenderData);

        papers = MY_PAPERS;
        papers.forEach(p => { if (p.category && p.category_en) catEnFromSheet[p.category] = p.category_en; });
        loaded = true;
        
        applyLang();
        route();
    </script>
</body>
</html>
