        function parseCSV(text) {
            text = text.replace(/^\uFEFF/, '');
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQuotes = false;
                    } else field += c;
                } else if (c === '"') {
                    inQuotes = true;
                } else if (c === ',') {
                    row.push(field); field = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(field); field = '';
                    rows.push(row); row = [];
                } else field += c;
            }
            if (field !== '' || row.length) { row.push(field); rows.push(row); }
            return rows;
        }

                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 font-medium">' + t('loadingPapers') + '</div>';
                    countEl.textContent = '';
                }
            }
            if (view === 'data') { renderDataChips(); renderDataSites(); }
            updateTitle();
        }

        // ========== الصفحة الرئيسية: أيقونات المجالات ==========
        function renderCategoryTiles() {
            categoryGrid.innerHTML = '';

            const counts = {};
            papers.forEach(p => {
                const c = p.category || 'عام';
                counts[c] = (counts[c] || 0) + 1;
            });
            const cats = [ALL, ...Object.keys(counts)];

            cats.forEach(cat => {
                const n = cat === ALL ? papers.length : counts[cat];

                const a = document.createElement('a');
                a.href = catHref(cat);
                a.className = 'group bg-white rounded-2xl p-6 shadow-sm border border-sky-100 hover:shadow-xl hover:border-brand-300 hover:-translate-y-0.5 transition-all duration-300 flex items-center gap-4';

                const ico = document.createElement('div');
                ico.className = 'w-14 h-14 shrink-0 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-400 text-white flex items-center justify-center shadow-md shadow-brand-500/20';
                ico.innerHTML = iconSvg(cat, 'w-7 h-7');

                const info = document.createElement('div');
                info.className = 'flex-1 min-w-0';
                const name = document.createElement('h3');
                name.className = 'font-bold text-slate-900 text-lg group-hover:text-brand-600 transition-colors';
                name.textContent = label(cat);
                const cnt = document.createElement('p');
                cnt.className = 'text-xs text-slate-500 mt-0.5';
                cnt.textContent = t('nPapers', n);
                info.append(name, cnt);

                const arrow = document.createElement('span');
                arrow.className = 'text-slate-300 group-hover:text-brand-600 transition-colors';
                arrow.innerHTML = '<svg class="w-5 h-5 ltr:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>';

                a.append(ico, info, arrow);
                categoryGrid.appendChild(a);
            });

            // أيقونة مستقلة لمصادر البيانات المفتوحة (بلون مختلف)
            const d = document.createElement('a');
            d.href = '#/data';
            d.className = 'group bg-white rounded-2xl p-6 shadow-sm border border-emerald-100 hover:shadow-xl hover:border-emerald-300 hover:-translate-y-0.5 transition-all duration-300 flex items-center gap-4';

            const dIco = document.createElement('div');
            dIco.className = 'w-14 h-14 shrink-0 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white flex items-center justify-center shadow-md shadow-emerald-500/20';
            dIco.innerHTML = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + ICONS.database + '</svg>';

            const dInfo = document.createElement('div');
            dInfo.className = 'flex-1 min-w-0';
            const dName = document.createElement('h3');
            dName.className = 'font-bold text-slate-900 text-lg group-hover:text-emerald-600 transition-colors';
            dName.textContent = t('dataTitle');
            const dCnt = document.createElement('p');
            dCnt.className = 'text-xs text-slate-500 mt-0.5';
            dCnt.textContent = t('nSites', DATA_SITES.length);
            dInfo.append(dName, dCnt);

            const dArrow = document.createElement('span');
            dArrow.className = 'text-slate-300 group-hover:text-emerald-600 transition-colors';
            dArrow.innerHTML = '<svg class="w-5 h-5 ltr:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>';

            d.append(dIco, dInfo, dArrow);
            categoryGrid.appendChild(d);
        }

        // ========== صفحة المجال: بطاقات الأوراق ==========
        function makeLink(href, text, primary) {
            const a = document.createElement('a');
            a.href = href;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = text;
            a.className = primary
                ? 'bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all'
                : 'bg-white hover:bg-sky-50 text-brand-700 font-bold text-xs px-4 py-2 rounded-lg border border-sky-200 transition-all';
            return a;
        }

        function renderCategoryPapers() {
            const base = papers.filter(p => currentCat === ALL || (p.category || 'عام') === currentCat);
            const q = searchInput.value.trim().toLowerCase();
            let list = base.filter(p =>
                !q || [p.title, p.authors, p.category, p.category_en, p.summary, p.summary_en, p.year].join(' ').toLowerCase().includes(q)
            );

            const sort = sortSelect.value;
            if (sort === 'newest') list = list.slice().sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
            if (sort === 'oldest') list = list.slice().sort((a, b) => (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999));

            document.getElementById('catSubtitle').textContent = t('nInField', base.length);
            countEl.textContent = t('showing', list.length, base.length) + (usingFallback ? t('fallbackNote') : '');
            grid.innerHTML = '';

            if (list.length === 0) {
                const d = document.createElement('div');
                d.className = 'col-span-full text-center py-12 text-slate-400 font-medium';
                d.textContent = base.length === 0 ? t('noPapers') : t('noResults');
                grid.appendChild(d);
                return;
            }

            list.forEach(p => {
                const card = document.createElement('article');
                card.className = 'bg-white rounded-2xl shadow-sm border border-sky-100 hover:shadow-xl hover:border-brand-300 transition-all duration-300 flex flex-col justify-between overflow-hidden';

                const body = document.createElement('div');
                body.className = 'p-6 space-y-3';

                const meta = document.createElement('div');
                meta.className = 'flex items-center justify-between text-xs font-bold text-brand-600';
                const cat = document.createElement('span');
                cat.className = 'bg-brand-50 px-3 py-1 rounded-md border border-brand-100';
                cat.textContent = label(p.category || 'عام');
                const yr = document.createElement('span');
                yr.textContent = p.year || '';
                meta.append(cat, yr);

                const h3 = document.createElement('h3');
                h3.className = 'text-lg font-bold text-slate-900 leading-snug text-start';
                h3.dir = 'auto';
                h3.textContent = p.title;

                const au = document.createElement('p');
                au.className = 'text-xs text-slate-500 font-medium text-start';
                au.dir = 'auto';
                au.textContent = p.authors || '';

                const sm = document.createElement('p');
                sm.className = 'text-slate-600 text-sm leading-relaxed line-clamp-5';
                sm.textContent = paperSummary(p);

                body.append(meta, h3, au, sm);

                const footer = document.createElement('div');
                footer.className = 'px-6 py-4 bg-sky-50/50 border-t border-sky-50 flex flex-wrap items-center gap-2';
                const page = safeUrl(p.page_url);
                const pdf = safeUrl(p.pdf_url);
                if (page) footer.appendChild(makeLink(page, t('viewPaper'), true));
                if (pdf) footer.appendChild(makeLink(pdf, t('openPdf'), false));
                if (!page && !pdf) {
                    const s = document.createElement('span');
                    s.className = 'text-xs text-slate-400';
                    s.textContent = t('noLink');
                    footer.appendChild(s);
                }

                card.append(body, footer);
                grid.appendChild(card);
            });
        }

        // ========== مصادر البيانات المفتوحة ==========
        // لإضافة موقع جديد: أضف سطراً بالشكل نفسه. type: ml أو repo أو gov.
        const DATA_TYPES = {
            ml:   { ar: 'تعلم آلة', en: 'Machine Learning' },
            repo: { ar: 'أبحاث ومستودعات', en: 'Research & Repositories' },
            gov:  { ar: 'حكومية ودولية', en: 'Government & International' }
        };

        const DATA_SITES = [
            { name: 'Kaggle Datasets', type: 'ml', url: 'https://www.kaggle.com/datasets', desc: 'منصة تضم آلاف مجموعات البيانات والدفاتر البرمجية ومسابقات علم البيانات، ومناسبة للتعلم والتجريب.', desc_en: 'A platform hosting thousands of datasets, notebooks and data science competitions, great for learning and experimenting.' },
            { name: 'Hugging Face Datasets', type: 'ml', url: 'https://huggingface.co/datasets', desc: 'مجموعات بيانات جاهزة للاستخدام في تدريب نماذج اللغة والرؤية والصوت، مع مكتبة برمجية لتحميلها بسهولة.', desc_en: 'Ready-to-use datasets for training language, vision and audio models, with a library to load them easily.' },
            { name: 'UCI Machine Learning Repository', type: 'ml', url: 'https://archive.ics.uci.edu', desc: 'من أقدم المستودعات وأكثرها استخداماً في أبحاث التعلم الآلي والتدريس الجامعي.', desc_en: 'One of the oldest and most widely used repositories for machine learning research and university teaching.' },
            { name: 'OpenML', type: 'ml', url: 'https://www.openml.org', desc: 'منصة مفتوحة لمشاركة مجموعات البيانات والتجارب ومقارنة أداء النماذج بشكل قابل للتكرار.', desc_en: 'An open platform for sharing datasets and experiments and comparing model performance reproducibly.' },
            { name: 'Google Dataset Search', type: 'repo', url: 'https://datasetsearch.research.google.com', desc: 'محرك بحث يجمع مجموعات البيانات من آلاف المواقع حول العالم في مكان واحد.', desc_en: 'A search engine that gathers datasets from thousands of sites across the web in one place.' },
            { name: 'Zenodo', type: 'repo', url: 'https://zenodo.org', desc: 'مستودع مفتوح لحفظ البيانات والأبحاث ومشاركتها، ويمنح كل مادة معرّفاً دائماً (DOI) يسهل الاستشهاد به.', desc_en: 'An open repository for storing and sharing data and research, giving each item a permanent DOI that is easy to cite.' },
            { name: 'AWS Open Data Registry', type: 'repo', url: 'https://registry.opendata.aws', desc: 'سجل لمجموعات بيانات ضخمة ومفتوحة مستضافة على خدمات أمازون السحابية.', desc_en: "A registry of large open datasets hosted on Amazon's cloud services." },
            { name: 'Our World in Data', type: 'repo', url: 'https://ourworldindata.org', desc: 'بيانات ورسوم بيانية تفاعلية عن قضايا العالم مثل الصحة والطاقة والتعليم، قابلة للتحميل.', desc_en: 'Interactive data and charts on global issues such as health, energy and education, available to download.' },
            { name: 'World Bank Open Data', type: 'gov', url: 'https://data.worldbank.org', desc: 'بيانات اقتصادية وتنموية لدول العالم من البنك الدولي، تغطي مؤشرات عديدة عبر سنوات طويلة.', desc_en: 'Economic and development data for countries around the world from the World Bank, covering many indicators over long periods.' },
            { name: 'UN Data', type: 'gov', url: 'https://data.un.org', desc: 'إحصاءات رسمية من الأمم المتحدة ومنظماتها في مجالات السكان والتعليم والبيئة وغيرها.', desc_en: 'Official statistics from the United Nations and its agencies on population, education, the environment and more.' },
            { name: 'Data.gov', type: 'gov', url: 'https://data.gov', desc: 'البوابة الرسمية للبيانات الحكومية المفتوحة في الولايات المتحدة.', desc_en: 'The official portal for open U.S. government data.' },
            { name: 'المنصة الوطنية للبيانات المفتوحة (السعودية)', name_en: 'Saudi National Open Data Platform', type: 'gov', url: 'https://open.data.gov.sa', desc: 'بوابة رسمية تنشر فيها الجهات الحكومية السعودية مجموعات بياناتها بصيغ مفتوحة قابلة للمعالجة.', desc_en: 'The official portal where Saudi government entities publish their datasets in open, machine-readable formats.' }
        ];

        let dataType = 'all';
        const dataSearch = document.getElementById('dataSearch');
        const dataGrid = document.getElementById('dataGrid');
        const dataChips = document.getElementById('dataChips');
        const dataCount = document.getElementById('dataCount');

        function typeLabel(k) { return k === 'all' ? t('dataAll') : DATA_TYPES[k][lang]; }

        function renderDataChips() {
            const keys = ['all', ...Object.keys(DATA_TYPES).filter(k => DATA_SITES.some(s => s.type === k))];
            dataChips.innerHTML = '';
            keys.forEach(k => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = typeLabel(k);
                b.className = 'px-4 py-1.5 rounded-full text-xs font-bold border transition-all ' +
                    (k === dataType ? 'bg-emerald-600 text-white border-emerald-600'
                                    : 'bg-white text-slate-600 border-emerald-200 hover:border-emerald-500 hover:text-emerald-700');
                b.addEventListener('click', () => { dataType = k; renderDataChips(); renderDataSites(); });
                dataChips.appendChild(b);
            });
        }

        function renderDataSites() {
            const q = dataSearch.value.trim().toLowerCase();
            const list = DATA_SITES.filter(s =>
                (dataType === 'all' || s.type === dataType) &&
                (!q || [s.name, s.name_en, DATA_TYPES[s.type].ar, DATA_TYPES[s.type].en, s.desc, s.desc_en].join(' ').toLowerCase().includes(q))
            );
            document.getElementById('dataSubtitle').textContent = t('dataSubtitle', DATA_SITES.length);
            dataCount.textContent = t('showingSites', list.length, DATA_SITES.length);
            dataGrid.innerHTML = '';

            if (list.length === 0) {
                const e = document.createElement('div');
                e.className = 'col-span-full text-center py-12 text-slate-400 font-medium';
                e.textContent = t('noResults');
                dataGrid.appendChild(e);
                return;
            }

            list.forEach(s => {
                const card = document.createElement('article');
                card.className = 'bg-white rounded-2xl shadow-sm border border-emerald-100 hover:shadow-xl hover:border-emerald-300 transition-all duration-300 flex flex-col justify-between overflow-hidden';

                const body = document.createElement('div');
                body.className = 'p-6 space-y-3';

                const tag = document.createElement('span');
                tag.className = 'inline-block bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-md border border-emerald-100';
                tag.textContent = typeLabel(s.type);

                const h3 = document.createElement('h3');
                h3.className = 'text-lg font-bold text-slate-900 leading-snug text-start';
                h3.dir = 'auto';
                h3.textContent = (lang === 'en' && s.name_en) ? s.name_en : s.name;

                const p = document.createElement('p');
                p.className = 'text-slate-600 text-sm leading-relaxed';
                p.textContent = (lang === 'en' && s.desc_en) ? s.desc_en : s.desc;

                body.append(tag, h3, p);

                const footer = document.createElement('div');
                footer.className = 'px-6 py-4 bg-emerald-50/50 border-t border-emerald-50';
                const href = safeUrl(s.url);
                if (href) {
                    const a = document.createElement('a');
                    a.href = href;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = t('visitSite');
                    a.className = 'inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all';
                    footer.appendChild(a);
                }

                card.append(body, footer);
                dataGrid.appendChild(card);
            });
        }

        // ========== التنقل بين الصفحات ==========
        function showHome() {
            view = 'home';
            catView.classList.add('hidden');
            dataView.classList.add('hidden');
            homeView.classList.remove('hidden');
            updateTitle();
        }

        function showCategory(cat) {
            view = 'cat';
            currentCat = cat;
            homeView.classList.add('hidden');
            dataView.classList.add('hidden');
            catView.classList.remove('hidden');
            document.getElementById('catTitle').textContent = label(cat);
            document.getElementById('catIcon').innerHTML = iconSvg(cat, 'w-7 h-7');
            searchInput.value = '';
            sortSelect.value = 'sheet';
            if (loaded) renderCategoryPapers();
            else {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 font-medium">' + t('loadingPapers') + '</div>';
                countEl.textContent = '';
            }
            updateTitle();
            window.scrollTo(0, 0);
        }

        function showData() {
            view = 'data';
            homeView.classList.add('hidden');
            catView.classList.add('hidden');
            dataView.classList.remove('hidden');
            document.getElementById('dataIcon').innerHTML = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + ICONS.database + '</svg>';
            dataSearch.value = '';
            dataType = 'all';
            renderDataChips();
            renderDataSites();
            updateTitle();
            window.scrollTo(0, 0);
        }

        function route() {
            const h = location.hash;
            if (h === '#/data') {
                showData();
            } else if (h.indexOf('#/c/') === 0) {
                let cat = ALL;
                try { cat = decodeURIComponent(h.slice(4)); } catch (e) {}
                showCategory(cat);
            } else {
                showHome();
                const id = h.slice(1);
                const el = id ? document.getElementById(id) : null;
                if (el) el.scrollIntoView();
                else window.scrollTo(0, 0);
            }
        }

        // ========== تحميل البيانات ==========
        async function loadPapers() {
            try {
                const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                papers = rowsToPapers(parseCSV(text));
                if (papers.length === 0) throw new Error('الجدول فارغ أو عناوين الأعمدة غير صحيحة');
                usingFallback = false;
            } catch (e) {
                console.error('Sheet load failed:', e);
                papers = FALLBACK_PAPERS;
                usingFallback = true;
            }
            catEnFromSheet = {};
            papers.forEach(p => { if (p.category && p.category_en) catEnFromSheet[p.category] = p.category_en; });
            loaded = true;
            renderCategoryTiles();
            if (view === 'cat') {
                document.getElementById('catTitle').textContent = label(currentCat);
                renderCategoryPapers();
                updateTitle();
            }
        }

        // ========== ربط الأحداث ==========
        searchInput.addEventListener('input', () => { if (loaded) renderCategoryPapers(); });
        sortSelect.addEventListener('change', () => { if (loaded) renderCategoryPapers(); });
        dataSearch.addEventListener('input', renderDataSites);
        window.addEventListener('hashchange', route);

        document.getElementById('langBtn').addEventListener('click', () => {
            lang = lang === 'ar' ? 'en' : 'ar';
            try { localStorage.setItem('svl_lang', lang); } catch (e) {}
            applyLang();
            refreshView();
        });

        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            const open = mobileMenu.classList.toggle('hidden') === false;
            menuBtn.setAttribute('aria-expanded', String(open));
        });
        document.querySelectorAll('.mobile-link').forEach(a => a.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            menuBtn.setAttribute('aria-expanded', 'false');
        }));

        applyLang();
        route();
        loadPapers();
    </script>
</body>
</html>
