        function iconKey(cat) {
            const c = String(cat).toLowerCase();
            if (cat === ALL) return 'grid';
            if (c.includes('لغة') || c.includes('لغو') || c.includes('language') || c.includes('nlp')) return 'chat';
            if (c.includes('رؤية') || c.includes('صور') || c.includes('بصر') || c.includes('vision') || c.includes('image')) return 'eye';
            if (c.includes('أمن') || c.includes('امن') || c.includes('حماية') || c.includes('security')) return 'shield';
            if (c.includes('سحاب') || c.includes('cloud')) return 'cloud';
            if (c.includes('برمج') || c.includes('هندسة') || c.includes('software') || c.includes('code')) return 'code';
            if (c.includes('عميق') || c.includes('ذكاء') || c.includes('تعلم') || c.includes('learning') || c.includes('ai')) return 'chip';
            return 'doc';
        }

        function iconSvg(cat, size) {
            return '<svg class="' + size + '" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + ICONS[iconKey(cat)] + '</svg>';
        }

        function imgFallback(img) {
            const list = (img.dataset.srcs || '').split(',').filter(Boolean);
            const i = parseInt(img.dataset.try || '0', 10);
            if (i < list.length) {
                img.dataset.try = String(i + 1);
                img.src = list[i];
            } else {
                img.onerror = null;
                img.src = 'https://placehold.co/500x600/e0f2fe/0284c7?text=Expert';
            }
        }

        function safeUrl(u) {
            try {
                const url = new URL(String(u || '').trim());
                return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '';
            } catch (e) { return ''; }
        }

        function debounce(fn, ms) {
            let t;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), ms);
            };

        function applyLang() {
            const html = document.documentElement;
            html.lang = lang;
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.alt = t(el.dataset.i18nAlt); });

            const meta = document.querySelector('meta[name="description"]');
            if (meta) meta.setAttribute('content', t('metaDesc'));
            document.getElementById('langBtn').textContent = t('langBtn');

            updateCategoryHeader();
            updateTitle();
        }

        function makeLink(href, text, primary) {
            const a = document.createElement('a');
            a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = text;
            a.className = primary
                ? 'bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all'
                : 'bg-white hover:bg-sky-50 text-brand-700 font-bold text-xs px-4 py-2 rounded-lg border border-sky-200 transition-all';
            return a;
        }

        function renderCategoryPapers() {
            const base = papers.filter(p => currentCat === ALL || (p.category || 'عام') === currentCat);
            const q = searchInput.value.trim().toLowerCase();
            let list = base.filter(p =>
                !q || [p.title, p.authors, p.category, p.category_en, p.summary, p.summary_en, p.year].join(' ').toLowerCase().includes(q)
            );
            const sort = sortSelect.value;
            if (sort === 'newest') list = list.slice().sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
            if (sort === 'oldest') list = list.slice().sort((a, b) => (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999));

            updateCategoryHeader();
            countEl.textContent = t('showing', list.length, base.length);
            grid.innerHTML = '';

            if (list.length === 0) {
                const d = document.createElement('div');
                d.className = 'col-span-full text-center py-12 text-slate-400 font-medium';
                d.textContent = base.length === 0 ? t('noPapers') : t('noResults');
                grid.appendChild(d);
                return;
            }

            list.forEach(p => {
                const card = document.createElement('article');
                card.className = 'bg-white rounded-2xl shadow-sm border border-sky-100 hover:shadow-xl hover:border-brand-300 transition-all duration-300 flex flex-col justify-between overflow-hidden';
                const body = document.createElement('div');
                body.className = 'p-6 space-y-3';

                const yr = document.createElement('span');

                const au = document.createElement('p');
                au.className = 'text-xs text-slate-500 font-medium text-start';

                const sm = document.createElement('p');
                sm.className = 'text-slate-600 text-sm leading-relaxed line-clamp-5';
                sm.textContent = paperSummary(p);
                body.append(meta, h3, au, sm);
                const footer = document.createElement('div');

                grid.appendChild(card);
            });
        }

        }

        function route(hashArg) {
            const h = (typeof hashArg === 'string') ? hashArg : location.hash;
            if (h === '#/data') {
                showData();
            } else if (h.indexOf('#/c/') === 0) {
                let cat = ALL;
                try { cat = decodeURIComponent(h.slice(4)); } catch (e) {}
                showCategory(cat);
            } else {
                showHome();
                const id = h.slice(1);
                const el = id ? document.getElementById(id) : null;
                if (el) el.scrollIntoView();
                else window.scrollTo(0, 0);
            }
        }

        // الدالة الجديدة التي تعتمد على البيانات المضمنة بدلاً من الاتصال بالإنترنت
        function loadPapers() {
            papers = MY_PAPERS;
            
            catEnFromSheet = {};
            papers.forEach(p => { if (p.category && p.category_en) catEnFromSheet[p.category] = p.category_en; });
            loaded = true;
            
            renderCategoryTiles();
            if (view === 'cat') {
                updateCategoryHeader();
                renderCategoryPapers();
                updateTitle();
            }
        }

        const debouncedRenderPapers = debounce(() => { if (loaded) renderCategoryPapers(); }, 150);
        const debouncedRenderData   = debounce(() => renderDataSites(), 150);

        searchInput.addEventListener('input', debouncedRenderPapers);
        sortSelect.addEventListener('change', () => { if (loaded) renderCategoryPapers(); });
        dataSearch.addEventListener('input', debouncedRenderData);

        window.addEventListener('hashchange', () => route());
        window.addEventListener('popstate', () => route());

        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        document.addEventListener('click', e => {
            const a = e.target.closest && e.target.closest('a[href^="#"]');
            if (!a) return;
            const h = a.getAttribute('href');
            if (!h || h === '#') return;
            e.preventDefault();
            try { history.pushState(null, '', h); } catch (err) {}
            route(h);
            mobileMenu.classList.add('hidden');
            menuBtn.setAttribute('aria-expanded', 'false');
        });

        document.getElementById('langBtn').addEventListener('click', () => {
            lang = lang === 'ar' ? 'en' : 'ar';
            try { localStorage.setItem('svl_lang', lang); } catch (e) {}
            applyLang();
            refreshView();
        });

        menuBtn.addEventListener('click', () => {
            const open = mobileMenu.classList.toggle('hidden') === false;
            menuBtn.setAttribute('aria-expanded', String(open));
        });

        renderNav();
        applyLang();
        renderServices();
        renderTips();
        renderTools();
        route();
        loadPapers();
    </script>
</body>
</html>
